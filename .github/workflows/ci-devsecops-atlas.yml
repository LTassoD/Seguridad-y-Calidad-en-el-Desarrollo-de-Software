name: CI-CD DevSecOps Atlas (Shift-Left & Fail Fast)

on:
  push:
    branches: [ main, unidad-3-automatizacion-pentesting ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  secrets_gitleaks:
    name: "1. Shift-Left: Secrets (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: "1.1 Checkout del código fuente"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "1.2 Escaneo de secretos en repositorio (Gitleaks v2)"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_sca:
    name: "2. Build & SCA (npm ci + npm audit)"
    runs-on: ubuntu-latest
    steps:
      - name: "2.1 Checkout del código fuente"
        uses: actions/checkout@v4

      - name: "2.2 Configurar Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "2.3 Build y SCA Backend (npm ci + npm audit)"
        run: |
          cd BACKEND
          npm ci
          npm audit --audit-level=high

      - name: "2.4 Build y SCA Frontend (npm ci + npm audit)"
        run: |
          cd FRONTEND
          npm ci
          npm audit --audit-level=high

  sast_eslint_auditor:
    name: "3. SAST (ESLint 9 + Auditor Transversal)"
    runs-on: ubuntu-latest
    steps:
      - name: "3.1 Checkout del código fuente"
        uses: actions/checkout@v4

      - name: "3.2 Configurar Node.js 20 y Python 3.12"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "3.3 Instalar dependencias para ESLint"
        run: |
          cd BACKEND && npm ci
          cd ../FRONTEND && npm ci

      - name: "3.4 Ejecutar Auditor SAST Transversal y generar reporte HTML"
        run: |
          python "Unidad 3/auditor_transversal_atlas.py" "."

      - name: "3.5 Publicar Reporte SAST como Artifact"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-sast-atlas
          path: "Unidad 3/reporte_auditoria_transversal_atlas.html"

      - name: "3.6 SAST: ESLint 9 Backend y Frontend (Fail Fast Gate)"
        run: |
          cd BACKEND && npx eslint .
          cd ../FRONTEND && npx eslint .

  deploy_gate_fail_fast:
    name: "4. DAST & Deploy Staging (Bloqueo Fail Fast)"
    needs: [ secrets_gitleaks, build_sca, sast_eslint_auditor ]
    runs-on: ubuntu-latest
    steps:
      - name: "4.1 Despliegue autorizado solo si se superan todos los Security Gates"
        run: echo "Todos los controles Shift-Left (Secrets, SCA, SAST) aprobados. Despliegue a Staging autorizado."
